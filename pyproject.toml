[project]
name = "harpoon"
version = "1.0.5"
description = "A Sublime Text plugin for marking files and jumping back to them instantly"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.pytest.ini_options]
pythonpath = ["stubs", "."]
testpaths = ["tests"]
python_files = ["test_harpoon_unit.py"]

[tool.ty.environment]
extra-paths = ["stubs"]

[tool.ty.src]
exclude = ["tests/test_harpoon.py"]
